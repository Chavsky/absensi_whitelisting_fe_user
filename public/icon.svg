<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with subtle tech border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- Geometric futuristic subtle watermark grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.18" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.25" />

  <!-- Modern Shield / Checkmark / Attendance Time Symbol -->
  <!-- Outer shield shape -->
  <path d="M 256 96 C 330 96 384 136 384 186 C 384 286 288 380 256 406 C 224 380 128 286 128 186 C 128 136 182 96 256 96 Z" 
        fill="url(#blueGrad)" opacity="0.15" />

  <path d="M 256 112 C 318 112 364 146 364 190 C 364 274 282 352 256 376 C 230 352 148 274 148 190 C 148 146 194 112 256 112 Z" 
        fill="none" stroke="url(#cyanAccent)" stroke-width="6" stroke-linejoin="round" />

  <!-- Clock & Verified Badge Central Icon -->
  <circle cx="256" cy="226" r="68" fill="#0F172A" stroke="#38BDF8" stroke-width="5" />
  
  <!-- Clock hands at 08:00 (formal attendance time) -->
  <line x1="256" y1="226" x2="256" y2="182" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="226" x2="216" y2="242" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="226" r="7" fill="#38BDF8" />

  <!-- Active status pulse indicator -->
  <circle cx="340" cy="156" r="14" fill="#10B981" filter="url(#glow)" />
  <circle cx="340" cy="156" r="8" fill="#FFFFFF" />

  <!-- Checkmark badge at bottom of shield -->
  <g transform="translate(256, 330)">
    <circle cx="0" cy="0" r="26" fill="#10B981" />
    <path d="M -9 0 L -3 6 L 9 -6" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
